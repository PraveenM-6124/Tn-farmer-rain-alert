services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tn_farmer_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tn_farmer_weather}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tn_farmer_weather}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
    driver: local
